name: scorecard

# OpenSSF Scorecard — supply-chain security posture score.
#
# Scorecard's SARIF/public-results path requires a public repo or GHAS. Public
# pull requests run it on the exact merge SHA so security-scan's hosted-scanner
# meta-check can fail closed. Non-public repositories use the local posture
# fallback in security-scan.yml; that narrower fallback does not claim parity.
on:
  branch_protection_rule:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "22 4 * * 1" # Mondays 04:22 UTC

permissions:
  contents: read

jobs:
  guard:
    name: visibility guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      public: ${{ steps.check.outputs.public }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          vis=$(gh api "repos/$REPO" --jq '.visibility')
          echo "repo visibility: $vis"
          if [ "$vis" = "public" ]; then echo "public=true" >> "$GITHUB_OUTPUT"; else echo "public=false" >> "$GITHUB_OUTPUT"; fi

  analysis:
    name: scorecard analysis
    needs: guard
    if: needs.guard.outputs.public == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write # upload SARIF
      id-token: write # publish results to the Scorecard API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: run scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: true
      # Upload SARIF only on push/schedule (the default-branch dashboard).
      # scorecard-action runs Branch-Protection ONLY on push events, so a PR
      # upload produces 2 of main's 3 SARIF categories; code-scanning then flags
      # the missing supply-chain/branch-protection as "1 configuration not found".
      # We still RUN scorecard on pull_request (the security-scan hosted-scanner
      # meta-check requires a successful run on the exact PR SHA), but skipping
      # the PR upload leaves nothing for code-scanning to diff against main.
      - name: upload SARIF
        if: github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: scorecard-results.sarif
          category: scorecard
